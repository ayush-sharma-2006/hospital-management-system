<template>
    <lightning-card title="doctor_registration" icon-name="standard:contact">

        <div class="slds-p-around_medium">

            <lightning-record-edit-form
                object-api-name="doctor__c"
                onsuccess={handleSuccess}
                onerror={handleError}>

                <lightning-messages></lightning-messages>

                <lightning-input-field
                    field-name="Name__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Email__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Mobile__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Specialization__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Availability__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Department__c">
                </lightning-input-field>

                <div class="slds-m-top_medium">

                    <lightning-button
                        type="submit"
                        variant="brand"
                        label="Register doctor">
                    </lightning-button>

                </div>

            </lightning-record-edit-form>

        </div>

    </lightning-card>
</template>
